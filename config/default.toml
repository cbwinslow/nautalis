[general]
user_id = ""
team_id = ""

[database]
driver = "postgres"

[database.postgres]
url = "postgresql://nautalis:nautalis@localhost:5432/nautalis"
max_connections = 20

[embeddings]
provider = "ollama"
model = "nomic-embed-text"

[embeddings.ollama]
url = "http://localhost:11434"

[llm]
provider = "ollama"
model = "qwen2.5:3b"

[llm.ollama]
url = "http://localhost:11434"

[[connectors]]
type = "claude_code"
enabled = true
source_dirs = ["~/.claude/projects"]

[[connectors]]
type = "kilo_code"
enabled = true
source_dirs = ["~/.kilocode/sessions"]

[[connectors]]
type = "cursor"
enabled = false
source_dirs = ["~/.cursor/sessions"]

[guardrails]
pii_detection = true
secret_detection = true
max_context_lines = 100
min_relevance_score = 0.7

[ratelimit]
enabled = true
max_requests = 100
window_ms = 60000

# Example: Define additional providers (OpenRouter, OpenAI, etc.)
# Then set embeddings.provider = "openrouter" or llm.provider = "openrouter"
[providers.openrouter]
type = "openai"
baseUrl = "https://openrouter.ai/api/v1"
model = "anthropic/claude-3-opus"
# apiKeyEnv = "OPENROUTER_API_KEY"  # set env variable

[providers.my-openai]
type = "openai"
baseUrl = "https://api.openai.com/v1"
model = "gpt-4-turbo"
# apiKeyEnv = "OPENAI_API_KEY"
