[general]
user_id = ""
team_id = ""

[database]
driver = "postgres"

[database.postgres]
url = "postgresql://nautalis:nautalis@localhost:5432/nautalis"
max_connections = 20

[embeddings]
provider = "ollama"
model = "nomic-embed-text"

[embeddings.ollama]
url = "http://localhost:11434"

[llm]
provider = "ollama"
model = "qwen2.5:3b"

[llm.ollama]
url = "http://localhost:11434"

[[connectors]]
type = "claude_code"
enabled = true
source_dirs = ["~/.claude/projects"]

[[connectors]]
type = "kilo_code"
enabled = true
source_dirs = ["~/.kilocode/sessions"]

[guardrails]
pii_detection = true
secret_detection = true
max_context_lines = 100
min_relevance_score = 0.7

[ratelimit]
enabled = true
max_requests = 100
window_ms = 60000
