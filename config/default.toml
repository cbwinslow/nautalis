[general]
user_id = ""
team_id = ""

[database]
driver = "postgres"

[database.postgres]
url = "postgresql://nautalis:nautalis@localhost:5432/nautalis"
max_connections = 20

[embeddings]
provider = "ollama"
model = "nomic-embed-text"

[embeddings.ollama]
url = "http://localhost:11434"

[llm]
provider = "ollama"
model = "qwen2.5:3b"

[llm.ollama]
url = "http://localhost:11434"

[[connectors]]
type = "claude_code"
enabled = true
source_dirs = ["~/.claude/projects"]

[[connectors]]
type = "kilo_code"
enabled = true
source_dirs = ["~/.kilocode/sessions"]

[[connectors]]
type = "cursor"
enabled = false
source_dirs = ["~/.cursor/sessions"]

[guardrails]
pii_detection = true
secret_detection = true
max_context_lines = 100
min_relevance_score = 0.7

[ratelimit]
enabled = true
max_requests = 100
window_ms = 60000

 # Example: Define additional providers (OpenRouter, OpenAI, Anthropic Claude, OpenCode Zen, KiloCode Gateway, etc.)
 # Then set embeddings.provider or llm.provider to the provider name
 [providers.openrouter]
 type = "openai"
 baseUrl = "https://openrouter.ai/api/v1"
 model = "anthropic/claude-3-opus"
 # apiKeyEnv = "OPENROUTER_API_KEY"  # set env variable
 
 # Free tier models on OpenRouter (rate-limited):
 [providers.openrouter-free]
 type = "openai"
 baseUrl = "https://openrouter.ai/api/v1"
 model = "anthropic/claude-3-haiku"
 # apiKeyEnv = "OPENROUTER_API_KEY"
 
 # OpenCode Zen (free coding-focused LLM endpoint, OpenAI-compatible)
 [providers.opencode-zen]
 type = "openai"
 baseUrl = "https://api.opencode.dev/zen/v1"
 model = "gpt-4o-mini"
 # apiKeyEnv = "OPENCODE_API_KEY"
 
 # KiloCode Gateway (free LLM gateway, OpenAI-compatible)
 [providers.kilocode-gateway]
 type = "openai"
 baseUrl = "https://gateway.kilocode.dev/v1"
 model = "claude-3-haiku"
 # apiKeyEnv = "KILOCODE_API_KEY"
 
 # OpenClaude (free Anthropic-compatible hosting)
 [providers.openclaude]
 type = "anthropic"
 baseUrl = "https://api.openclaude.ai/v1"
 # model = "claude-3-haiku"
 # apiKeyEnv = "ANTHROPIC_API_KEY"  # or provider-specific key
 
 # To use any of these as your LLM, set e.g.:
 # llm.provider = "openclaude"
 # or
 # llm.provider = "openrouter-free"

[providers.my-openai]
type = "openai"
baseUrl = "https://api.openai.com/v1"
model = "gpt-4-turbo"
# apiKeyEnv = "OPENAI_API_KEY"
