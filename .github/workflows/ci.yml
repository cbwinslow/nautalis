name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nautalis
          POSTGRES_PASSWORD: nautalis
          POSTGRES_DB: nautalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://nautalis:nautalis@localhost:5432/nautalis_test
        run: |
          for f in migrations/postgres/core/*.sql; do
            PGPASSWORD=nautalis psql -h localhost -U nautalis -d nautalis_test -f "$f"
          done
          for f in migrations/postgres/timescaledb/*.sql; do
            PGPASSWORD=nautalis psql -h localhost -U nautalis -d nautalis_test -f "$f" || true
          done
          for f in migrations/postgres/rls/*.sql; do
            PGPASSWORD=nautalis psql -h localhost -U nautalis -d nautalis_test -f "$f"
          done
      - name: Run tests
        env:
          DATABASE_URL: postgresql://nautalis:nautalis@localhost:5432/nautalis_test
        run: bun run test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t nautalis:${{ github.sha }} .
      - name: Test Docker image
        run: docker run --rm nautalis:${{ github.sha }} --help
