# Enterprise deployment — Full Supabase + TimescaleDB + Observability
services:
  nautalis:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
      - "9090:9090"
    environment:
      - NAUTALIS_DB_DRIVER=supabase
      - NAUTALIS_SUPABASE_URL=http://kong:8000
      - NAUTALIS_SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NAUTALIS_EMBED_PROVIDER=ollama
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - kong
    restart: unless-stopped
    deploy:
      replicas: 2

  # Supabase full stack
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
    deploy:
      resources:
        limits:
          memory: 8G

  kong:
    image: kong:2.8.1
    ports:
      - "8000:8000"
      - "8443:8443"

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    restart: unless-stopped

  # Jaeger for trace visualization
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "4317:14317"   # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # Grafana for metrics dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  db-data:
  grafana-data:
