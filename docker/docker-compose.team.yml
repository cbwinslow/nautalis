# Team deployment — Supabase self-hosted stack
services:
   nautalis:
     build:
       context: ..
       dockerfile: docker/Dockerfile
     ports:
       - "3001:3001"
       - "9090:9090"
     environment:
       - NAUTALIS_DB_DRIVER=supabase
       - NAUTALIS_SUPABASE_URL=http://kong:8000
       - NAUTALIS_SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
       - NAUTALIS_EMBED_PROVIDER=ollama
       - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
     depends_on:
       - kong
     healthcheck:
       test: ["CMD", "bun", "-e", "try { const res = await (await fetch('http://localhost:3001/health')).ok; process.exit(res ? 0 : 1) } catch (e) { process.exit(1) }"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 5s
     restart: unless-stopped

  # Supabase stack (simplified — use supabase/docker for full stack)
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s

  kong:
    image: kong:2.8.1
    ports:
      - "8000:8000"
      - "8443:8443"

volumes:
  db-data:
